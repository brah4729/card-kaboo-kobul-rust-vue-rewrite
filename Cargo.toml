[workspace]
resolver = "3"
members = ["crates/engine", "crates/protocol", "crates/room", "crates/worker"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
kaboo-engine = { path = "crates/engine" }
kaboo-protocol = { path = "crates/protocol" }
kaboo-room = { path = "crates/room" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
