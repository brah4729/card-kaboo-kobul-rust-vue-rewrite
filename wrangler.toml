# Kaboo on Cloudflare Workers (free plan). One Worker serves the Vue build as
# static assets and the API; one Durable Object per room holds its state.
name = "kaboo"
main = "crates/worker/build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"
cwd = "crates/worker"
watch_dir = ["crates/engine/src", "crates/protocol/src", "crates/room/src", "crates/worker/src"]

[assets]
directory = "./web/dist"
# Unknown paths serve index.html, so a deep link still opens the app.
not_found_handling = "single-page-application"
# The API is the Worker's; everything else is a file.
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# The free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
